services:
  # ========================================
  # DEBUG
  # ========================================
  debug:
    build: ./debug
    container_name: debug
    platform: linux/amd64
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      - external_net
      - dmz_net
      - internal_net

  # ========================================
  # EXTERNAL CLIENT AND SERVER
  # ========================================

  
  allowed-server:
    build: ./external-services/allowed-server
    networks:
      - external_net
    ports:
      - "8090:80"

  blocked-server:
    build: ./external-services/blocked-server
    networks:
      - external_net
    ports:
      - "8091:80"


  #Simula client esterno
  firefox:
    image: jlesage/firefox:latest
    container_name: firefox
    cap_add:
      - NET_ADMIN 
    networks:
      - external_net
    environment:
      - TZ=Europe/Rome
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
    ports:
      - "5600:5800"
    volumes:
      - ./external-clients/config:/config:rw

  # ========================================
  # PERIMETRAL DEFENSE
  # ========================================


  # Envoy Proxy (PEP) + Firewall L7 (->esterno) + Firewall L3 (->interno)
  pep-envoy:
    build: ./authorization-system/envoy/compose
    container_name: pep-envoy
    # Stranamente envoy non interpreta le variabili d'ambiente :(
    platform: linux/amd64
    environment:
      - DEBUG_LEVEL=info
      - SERVICE_NAME=internal-service
      - SERVICE_PORT=8080
      # Varibili necessarie per la configurazione di Secret Discovery Service (SDS)
      - SERVICE_NODE=node1
      - SERVICE_CLUSTER=cluster1
    volumes:
      - ./authorization-system/envoy/envoy.yaml:/config/envoy.yaml
      - ./authorization-system/envoy/secrets/oauth-token-secret.yaml:/etc/envoy/oauth-token-secret.yaml
      - ./authorization-system/envoy/secrets/oauth-hmac-secret.yaml:/etc/envoy/oauth-hmac-secret.yaml
      - ./authorization-system/envoy/secrets/certs:/etc/envoy/certs
    networks:
      external_net:
        ipv4_address: 10.20.0.100
      dmz_net:
        ipv4_address: 10.21.0.100
      internal_net:
        ipv4_address: 10.22.0.100
      prod_net:
        ipv4_address: 10.23.0.100
      dev_net:
        ipv4_address: 10.24.0.100
    ports:
      - "10000:10000"   # HTTP → redirect to 10001
      - "10001:10001"   # HTTPS → OAuth2/ExtAuthz/Router ingress
      - "10002:10002"   # Admin 
      - "10003:10003"   # HTTP → redirect to 10004
      - "10004:10004"   # HTTP egress (non esposto esternamente)


  # ========================================
  # AUTHENTICATION SYSTEM
  # ========================================

  # Keycloak (IdP per autenticazione)
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    platform: linux/amd64
    command:
      - start-dev
      - --http-enabled=true
      # Admin ingresso http su 8081
      # Scambio token https su 8443
      - --http-port=8081
      - --https-port=8443
      - --hostname-strict=false
      - --import-realm
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      # Essenziali per fare in modo che si abiliti https
      - KC_HTTPS_CERTIFICATE_FILE=/etc/keycloak/certs/server.crt
      - KC_HTTPS_CERTIFICATE_KEY_FILE=/etc/keycloak/certs/server.key
      - KC_PROXY=edge
    volumes:
      #Preso lo stesso certificato di envoy (solo proof of concept)
      - ./authorization-system/envoy/secrets/certs:/etc/keycloak/certs
      - ./authentication-system/keycloak/data/h2:/opt/keycloak/data/h2
    ports:
      - "8081:8081"
      - "8443:8443"
    networks:
      external_net:
        ipv4_address: 10.20.0.21
      dmz_net:
        ipv4_address: 10.21.0.21
      internal_net:
        ipv4_address: 10.22.0.21
      prod_net:
        ipv4_address: 10.23.0.21
      dev_net:
        ipv4_address: 10.24.0.21
        
      
  keycloak-listener:
    build:
      context: ./authentication-system/keycloak-listener
      dockerfile: Dockerfile
    container_name: keycloak-listener
    platform: linux/amd64
    environment:
      KEYCLOAK_BASE: "http://keycloak:8081"
      KEYCLOAK_REALM: "zerotrust"
      KEYCLOAK_ADMIN_USER: "admin"
      KEYCLOAK_ADMIN_PASS: "admin"
      TRUST_URL: "http://trust-service:5000/event"
    depends_on:
      - keycloak
      - trust-service
    networks:
      - dev_net
      - internal_net
      - dmz_net

  # ========================================
  # AUTHORIZATION SYSTEM
  # ========================================

 
  # OPA (PDP)
  pdp-opa:
    image: openpolicyagent/opa:latest-envoy
    container_name: pdp-opa
    platform: linux/amd64
    networks:
      - internal_net
    command:
      - "run"
      - "--server"
      - "--log-level=debug"
      - "--set=plugins.envoy_ext_authz_grpc.addr=:9191"
      # Per passare gli header

      - "--set=plugins.envoy_ext_authz_grpc.query=data.envoy.authz.response"
      - "--set=decision_logs.console=true"
      - "/policies/policy.rego"
    volumes:
      - ./authorization-system/opa/policies:/policies:ro
    ports:
      - "9191:9191" # gRPC plugin port OPA -> Envoy gRPC

  #Calcola il livello di fiducia e dialoga con il db
  trust-service:
    build:
      context: ./authorization-system/trust-service
      dockerfile: Dockerfile
    container_name: trust-service
    platform: linux/amd64
    environment:
      # Utente predisposto, diverso dall'admin di Postgres
      DATABASE_URL: "postgresql://trust_user:trust_pass@postgres:5432/companydb"
      T_SCALE_MINUTES: "1440" # default: 1 giorno
      PORT: "5000"
    networks:
      - internal_net
    ports:
      - "5000:5000"
    depends_on:
      - postgres

  # Postgres (DBMS interno)
  postgres:
    image: postgres:latest
    container_name: postgres
    platform: linux/amd64
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: companydb
    networks:
      - internal_net
    ports:
      - "5432:5432"
    volumes:
      - ./authorization-system/postgres/data:/var/lib/postgresql/data
      - ./authorization-system/postgres/init:/docker-entrypoint-initdb.d

  #Sito aziendale
  internal-service:
    build:
      context: ./internal-web-service
    image: internal-service:latest
    container_name: internal-service
    platform: linux/amd64
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - dmz_net
    ports:
      - "8080:8080"
  #Per aggiungere healthcheck decommentare le righe sottostanti
  #healthcheck:
  #  test: ["CMD", "node", "healthcheck.js"]
  #  interval: 10s
  #  timeout: 3s
  #  retries: 5


  # ========================================
  # HOST WORKSTATIONS (Simulano PC aziendali)
  # ========================================

  dev-host:
    image: jlesage/firefox:latest
    container_name: dev-host
    environment:
      - TZ=Europe/Rome
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=768
    networks:
      - dev_net
    ports:
      - "5800:5800"   # noVNC: http://localhost:5800
    volumes:
      - ./hosts/dev-host/config:/config:rw


  prod-host:
    image: jlesage/firefox:latest
    container_name: prod-host
    environment:
      - TZ=Europe/Rome
      - DISPLAY_WIDTH=1366
      - DISPLAY_HEIGHT=768
    networks:
      - prod_net
    ports:
      - "5700:5800"   # noVNC: http://localhost:5700
    volumes:
      - ./hosts/prod-host/config:/config:rw


#====================== DA CONFIGURARE ======================
      
#SNORT

    # ========================================
  # IDS - SNORT
  # ========================================
  snort-ids:
    build:
      context: ./snort
      dockerfile: Dockerfile
    container_name: snort-ids
    network_mode: host 
    platform: linux/amd64
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
      - SYS_RESOURCE
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./snort/snort.conf:/etc/snort/snort.conf:ro
      - ./snort/custom.rules:/etc/snort/rules/custom.rules:ro
      - snort-logs:/var/log/snort
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

#SPLUNK
#FLUENTD

# ========================================
# NET
# ========================================
networks:
  external_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.20.0.0/24
  dmz_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.21.0.0/24
  internal_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.22.0.0/24
  prod_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.23.0.0/24
  dev_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.24.0.0/24

volumes:
  snort-logs:
    driver: local