# Porte in ascolto
http_port 10.20.0.20:8080
http_port 10.20.0.20:8443

# ACL
acl SSL_ports port 443 10001 8443
acl Safe_ports port 80 443 10000 10001
acl CONNECT method CONNECT
acl external_net src 10.20.0.0/24

# Permessi
http_access allow external_net
http_access deny all

# ============================================
# FORZA TUTTO VERSO PEP-ENVOY (HTTPS:10001)
# ============================================

# Cache peer su porta HTTPS per evitare loop redirect
cache_peer 10.21.0.100 parent 10000 0 no-query no-digest originserver name=pep

# Forza TUTTE le richieste attraverso pep-envoy
never_direct allow all

# ============================================

# CACHE DISABILITATA
cache deny all
cache_dir null /tmp
memory_pools off
memory_pools_limit 0
cache_mem 8 MB
maximum_object_size_in_memory 0 KB
maximum_object_size 0

# Timeout
forward_timeout 30 seconds
connect_timeout 10 seconds
read_timeout 30 seconds
request_timeout 30 seconds


