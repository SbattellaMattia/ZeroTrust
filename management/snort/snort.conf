# Snort Configuration File - Snort 2.9.20

# ================================
# NETWORK VARIABLES
# ================================
var HOME_NET [10.21.0.0/24,10.22.0.0/24,10.23.0.0/24,10.24.0.0/24]
var EXTERNAL_NET !10.20.0.0/24
var DNS_SERVERS $HOME_NET
var SMTP_SERVERS $HOME_NET
var HTTP_SERVERS $HOME_NET
var SQL_SERVERS $HOME_NET

# ================================
# RULE PATH
# ================================
var RULE_PATH /etc/snort/rules

# ================================
# PORT VARIABLES
# ================================
var HTTP_PORTS 80
var HTTPS_PORTS 443
var SSH_PORTS 22

# ================================
# OUTPUT MODULES
# ================================
output alert_fast: /var/log/snort/alert

# ================================
# PREPROCESSORS - MINIMAL
# ================================
preprocessor frag3_global: max_frags 65536
preprocessor frag3_engine: policy windows

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy windows

# ================================
# INCLUDE RULES
# ================================
include $RULE_PATH/custom.rules
