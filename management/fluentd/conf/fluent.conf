# =========================
# SORGENTI
# =========================

# Driver logging da Docker (forward)
<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
</source>

# Monitor agent (opzionale)
<source>
  @type monitor_agent
  bind 127.0.0.1
  port 24220
</source>

<source>
  @type tail
  path /var/log/snort/alert
  pos_file /fluentd/buffer/snort-alert-fast.pos  
  tag snort.alert
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{2}\/\d{2}-\d{2}:\d{2}:\d{2}\.\d+)\s+\[\*\*\]\s+\[(?<gid>\d+):(?<sid>\d+):(?<rev>\d+)\]\s+(?<signature>.*?)\s+\[\*\*\]\s+\[Priority:\s*(?<priority>\d+)\]\s+\{(?<protocol>[^}]+)\}\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)(?::(?<src_port>\d+))?\s+->\s+(?<dest_ip>\d+\.\d+\.\d+\.\d+)(?::(?<dest_port>\d+))?/
  </parse>
</source>



# =========================
# FILTRI
# =========================

<filter snort.alert>
  @type record_transformer
  enable_ruby true
  <record>
    index       zt
    sourcetype  snort:alert
    severity    ${ case record["priority"].to_s; when "1" then "high"; when "2" then "medium"; else "low"; end }
  </record>
  remove_keys gid,rev
</filter>

# Snort syslog → allinea a snort:alert
<filter snort.syslog>
  @type record_transformer
  enable_ruby true
  <record>
    index       zt
    sourcetype  snort:alert
    severity    ${ (record["priority"].to_s == "1") ? "high" : (record["priority"].to_s == "2") ? "medium" : "low" }
  </record>
</filter>


# Filtra solo log pep-envoy con [INGRESS] o [EGRESS]
<filter pep-envoy.**>
  @type grep
  <regexp>
    key log
    pattern /\[(INGRESS|EGRESS)\]/
  </regexp>
</filter>

# Parser multi-formato per INGRESS ed EGRESS
<filter pep-envoy.**>
  @type parser
  key_name log
  reserve_data true
  reserve_time true
  emit_invalid_record_to_error false
  
  <parse>
    @type multi_format
    
    # Pattern per INGRESS
    <pattern>
      format regexp
      expression /^\[(?<direction>INGRESS)\]\[(?<timestamp>[^\]]+)\] SRC_IP=(?<src_ip>[^ ]+) ORIGINAL_DST=(?<original_dst>[^ ]+) (?<method>[^ ]+) (?<path>[^ ]+) → (?<upstream_cluster>[^ ]+) (?<response_code>\d+) AUTH=(?<auth_token>[^ ]+) RBAC=(?<rbac_result>.*)$/
      time_key timestamp
      time_format %Y-%m-%dT%H:%M:%S.%LZ
    </pattern>
    
    # Pattern per EGRESS
    <pattern>
      format regexp
      expression /^\[(?<direction>EGRESS)\]\[(?<timestamp>[^\]]+)\] SRC=(?<src_ip>[^ ]+) DST=(?<dst_authority>[^ ]+) TARGET=(?<target_host>[^ ]+) PATH=(?<path>[^ ]+) METHOD=(?<method>[^ ]+) CLUSTER=(?<upstream_cluster>[^ ]+) STATUS=(?<response_code>\d+)$/
      time_key timestamp
      time_format %Y-%m-%dT%H:%M:%S.%LZ
    </pattern>
  </parse>
</filter>

<filter **.keycloak.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /type="(?<type>[A-Z_]+)".*(?:username="(?<user>[^"]+)".*ipAddress="(?<src_ip>[^"]+)"|ipAddress="(?<src_ip>[^"]+)".*username="(?<user>[^"]+)")/
  </parse>
</filter>

<filter **.keycloak.**>
  @type record_transformer
  enable_ruby true
  <record>
    index      zt
    sourcetype keycloak:login
    event      ${ e=(record['event']||record['type']||'').to_s.downcase; (e=='login'||e=='code_to_token') ? 'login_success' : ( e.include?('error') ? 'login_failed' : e ) }
    user       ${ ((record['user'] || record['username'] || record['preferred_username'] || record['userId']) rescue nil).to_s }
    src_ip     ${ ((record['src_ip'] || record['ip_address'] || record['ipAddress']) rescue nil).to_s }
  </record>
  remove_keys log,type
</filter>

# =========================
# OUTPUT
# =========================

<match **>
  @type copy

  <store>
    @type stdout
  </store>

  <store>
    @type splunk_hec
    hec_host splunk
    hec_port 8088
    protocol http
    hec_token f276f7d2-1e16-4520-a999-a935a465299f
    index zt
    sourcetype_key sourcetype
    <buffer>
      @type file
      path /fluentd/buffer/hec.*.buffer
      flush_interval 5s
      retry_forever true
    </buffer>
  </store>
</match>
