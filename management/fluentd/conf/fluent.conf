# =========================
# SORGENTI
# =========================

# Driver logging da Docker (forward)
<source>
  @type forward
  @id in_forward
  bind 0.0.0.0
  port 24224
</source>

# Monitor agent (opzionale)
<source>
  @type monitor_agent
  bind 127.0.0.1
  port 24220
</source>

<source>
  @type tail
  path /var/log/snort/alert
  pos_file /fluentd/buffer/snort-alert-fast.pos  
  tag snort.alert
  read_from_head true
  <parse>
    @type regexp
    expression /^(?<timestamp>\d{2}\/\d{2}-\d{2}:\d{2}:\d{2}\.\d+)\s+\[\*\*\]\s+\[(?<gid>\d+):(?<sid>\d+):(?<rev>\d+)\]\s+(?<signature>.*?)\s+\[\*\*\]\s+\[Priority:\s*(?<priority>\d+)\]\s+\{(?<protocol>[^}]+)\}\s+(?<src_ip>\d+\.\d+\.\d+\.\d+)(?::(?<src_port>\d+))?\s+->\s+(?<dest_ip>\d+\.\d+\.\d+\.\d+)(?::(?<dest_port>\d+))?/
  </parse>
</source>

# =========================
# FILTRI
# =========================

<filter snort.alert>
  @type record_transformer
  enable_ruby true
  <record>
    index       zt
    sourcetype  snort:alert
    severity    ${ case record["priority"].to_s; when "1" then "high"; when "2" then "medium"; else "low"; end }
  </record>
  remove_keys gid,rev
</filter>

# Snort syslog → allinea a snort:alert
<filter snort.syslog>
  @type record_transformer
  enable_ruby true
  <record>
    index       zt
    sourcetype  snort:alert
    severity    ${ (record["priority"].to_s == "1") ? "high" : (record["priority"].to_s == "2") ? "medium" : "low" }
  </record>
</filter>

# Envoy → envoy:authz (match sul nome container nel tag del driver: {{.Name}}.{{.ID}})
# Envoy (tag derivato dal nome container, es: **.pep-envoy.**)
<filter **.pep-envoy.**>
  @type record_transformer
  enable_ruby true
  <record>
    index       zt
    sourcetype  envoy:authz

    # campi protetti: se mancano -> stringa vuota (niente errori)
    user        ${ ((record['x-user'] || record['user'])          rescue nil).to_s }
    decision    ${ ((record['decision'])                          rescue nil).to_s }
    path        ${ ((record['path'] || (record['request'] && record['request']['path']))       rescue nil).to_s }
    method      ${ ((record['method'] || (record['request'] && record['request']['method']))   rescue nil).to_s }
    src_ip      ${ ((record['src_ip'] || record['downstream_remote_address'] || record['remote']) rescue nil).to_s }
    http_status ${ ((record['http_status'] || record['status'])   rescue nil).to_s }
  </record>
  remove_keys log
</filter>

<filter **.keycloak.**>
  @type parser
  key_name log
  reserve_data true
  <parse>
    @type regexp
    expression /type="(?<type>[A-Z_]+)".*(?:username="(?<user>[^"]+)".*ipAddress="(?<src_ip>[^"]+)"|ipAddress="(?<src_ip>[^"]+)".*username="(?<user>[^"]+)")/
  </parse>
</filter>

<filter **.keycloak.**>
  @type record_transformer
  enable_ruby true
  <record>
    index      zt
    sourcetype keycloak:login
    event      ${ e=(record['event']||record['type']||'').to_s.downcase; (e=='login'||e=='code_to_token') ? 'login_success' : ( e.include?('error') ? 'login_failed' : e ) }
    user       ${ ((record['user'] || record['username'] || record['preferred_username'] || record['userId']) rescue nil).to_s }
    src_ip     ${ ((record['src_ip'] || record['ip_address'] || record['ipAddress']) rescue nil).to_s }
  </record>
  remove_keys log,type
</filter>

# =========================
# OUTPUT
# =========================

<match **>
  @type copy

  <store>
    @type stdout
  </store>

  <store>
    @type splunk_hec
    hec_host splunk
    hec_port 8088
    protocol http
    hec_token f276f7d2-1e16-4520-a999-a935a465299f
    index zt
    sourcetype_key sourcetype
    <buffer>
      @type file
      path /fluentd/buffer/hec.*.buffer
      flush_interval 5s
      retry_forever true
    </buffer>
  </store>
</match>
